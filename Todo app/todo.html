<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <h1>Todo App</h1>
    <div class="container">
        <div class="todo-app">
            <h2>Todo List <img src="" alt=""></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Enter a text:">
                <button onclick="addTask()">ADD</button>
            </div>
            <ul id="list-container">
                <li class="checked">Task 0</li>
                <li>Task 1</li>
            </ul>
        </div>
    </div>
    <script src="todo.js"></script>
</body>
</html>
